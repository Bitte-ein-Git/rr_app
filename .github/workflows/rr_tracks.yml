name: 🗺️ Update Tracklist

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-tracks:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install axios adm-zip xlsx

      - name: Run Update Script
        run: node scripts/update-tracks.js

      - name: Commit and Push if changed
        run: |
          # Git User Konfiguration für den Bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Prüfen auf Änderungen
          if [[ -n $(git status -s tracks.json) ]]; then
            git add tracks.json
            git commit -m "🗺️ Tracklist updated"
            git push
          else
            echo "No changes in tracklist."
          fi